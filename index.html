<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IctusSOS v2.0 — Escala BE-FAST, Triaje de Gran Vaso (VAN) y Test de Arritmia</title>
  <meta name="description" content="Cribado prehospitalario de Ictus con escala BE-FAST (sensibilidad 95%), detección de Oclusión de Gran Vaso y test de arritmia. 100% privado en tu navegador.">
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --danger: #EF4444;
      --danger-hover: #DC2626;
      --danger-light: #450A0A;
      --warning: #F59E0B;
      --success: #10B981;
      --primary: #3B82F6;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      background: rgba(239, 68, 68, 0.2);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.35rem;
      border-radius: 12px;
      overflow-x: auto;
    }
    .tab-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .step-box {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .step-box:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .step-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
    }
    .step-num {
      width: 32px;
      height: 32px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: bold;
    }
    .step-title {
      font-size: 1.15rem;
      font-weight: 800;
    }
    .step-instructions {
      color: #CBD5E1;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .btn-check {
      padding: 1rem 0.75rem;
      background: #0F172A;
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
    }
    .btn-check.selected-normal {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.15);
      color: #6EE7B7;
    }
    .btn-check.selected-danger {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.2);
      color: #FCA5A5;
    }

    .btn-emergency {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 1.25rem;
      background: var(--danger);
      color: white;
      font-size: 1.35rem;
      font-weight: 900;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .emergency-banner {
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid var(--danger);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .emergency-banner h3 {
      color: #F87171;
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 0.35rem;
    }

    .protocol-card {
      background: #0F172A;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .protocol-list {
      list-style: none;
      margin-top: 0.5rem;
    }
    .protocol-list li {
      position: relative;
      padding-left: 1.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .protocol-list li::before {
      position: absolute;
      left: 0;
      font-weight: bold;
    }
    .list-do li::before { content: "✅"; }
    .list-dont li::before { content: "❌"; }

    /* Pulso */
    .pulse-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #EF4444 0%, #B91C1C 100%);
      border: 6px solid rgba(239, 68, 68, 0.4);
      color: white;
      font-size: 1.25rem;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 1.5rem auto;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
      transition: transform 0.05s ease;
    }
    .pulse-btn:active { transform: scale(0.92); }

    .pulse-metric-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
      text-align: center;
    }
    .metric-item {
      background: #0F172A;
      border-radius: 10px;
      padding: 0.85rem;
    }
    .metric-value { font-size: 1.5rem; font-weight: 900; color: #FFFFFF; }
    .metric-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }

    .van-box {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">⏱️ CÓDIGO ICTUS v2.0 · ESCALA BE-FAST (S 95%)</div>
    <h1>IctusSOS</h1>
    <p class="subtitle">Detección prehospitalaria de Ictus anterior y posterior + Triaje de Oclusión de Gran Vaso (VAN)</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabBefast" onclick="cambiarTab('befast')">🚨 Cribado BE-FAST</button>
    <button class="tab-btn" id="tabPulse" onclick="cambiarTab('pulse')">🫀 Test de Pulso / Arritmia</button>
    <button class="tab-btn" id="tabProtocol" onclick="cambiarTab('protocol')">📋 Protocolo 112</button>
  </div>

  <div class="card" id="contentCard">
    <!-- Contenido dinámico -->
  </div>
</div>

<script src="ictussos.js"></script>
<script>
  'use strict';

  var tabActual = 'befast';
  var befastState = {
    equilibrio: null,
    ojos: null,
    cara: null,
    brazo: null,
    habla: null,
    hora: ''
  };

  var vanState = {
    vision: false,
    afasia: false,
    negligencia: false
  };

  var pulseState = {
    timestamps: [],
    activo: false
  };

  var ubicacionTexto = 'Obteniendo localización GPS...';

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (pos) {
      ubicacionTexto = 'Coordenadas GPS: ' + pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5);
    }, function () {
      ubicacionTexto = 'Ubicación GPS no disponible (indicar dirección postal al 112).';
    });
  }

  function cambiarTab(tab) {
    tabActual = tab;
    document.getElementById('tabBefast').classList.toggle('active', tab === 'befast');
    document.getElementById('tabPulse').classList.toggle('active', tab === 'pulse');
    document.getElementById('tabProtocol').classList.toggle('active', tab === 'protocol');

    if (tab === 'befast') renderBefast();
    else if (tab === 'pulse') renderPulse();
    else renderProtocol();
  }

  function renderBefast() {
    var evaluacion = IctusSOS.evaluarBEFAST(befastState);
    var card = document.getElementById('contentCard');
    var html = '';

    if (evaluacion.sospechaIctus) {
      var ventana = IctusSOS.calcularVentanaTerapeutica(befastState.hora);
      var vanRes = IctusSOS.evaluarLVO_VAN({
        debilidadBrazo: befastState.brazo === true,
        alteracionVisual: vanState.vision,
        afasiaComprension: vanState.afasia,
        negligenciaEspacial: vanState.negligencia
      });

      html += `
        <div class="emergency-banner">
          <h3>🚨 ALERTA: ALTA SOSPECHA DE ICTUS AGUDO (${evaluacion.porcentajeEstimado})</h3>
          <p style="color:#CBD5E1; font-size:0.95rem; margin-top:0.25rem;">
            Territorio detectado: <strong>${evaluacion.territorioProbable.replace(/_/g, ' ').toUpperCase()}</strong>.
            ${evaluacion.signos.equilibrio || evaluacion.signos.ojos ? ' <em>(Signos de circulación posterior/tronco encefálico capturados)</em>.' : ''}
          </p>
        </div>

        <a href="tel:112" class="btn-emergency">
          📞 LLAMAR AL 112 AHORA
        </a>

        <div style="background:#0F172A; border-radius:12px; padding:1.25rem; margin-bottom:1.5rem; border-left:4px solid var(--primary);">
          <div style="font-size:0.85rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Qué decirle al operador del 112:</div>
          <p style="font-size:1.05rem; font-weight:700; margin:0.5rem 0; color:#FFFFFF;">
            «${evaluacion.mensajeSugerido112}»
          </p>
          <div style="font-size:0.9rem; color:#93C5FD;">📍 ${ubicacionTexto}</div>
        </div>

        ${befastState.hora ? `
          <div style="background:#0F172A; border-radius:12px; padding:1rem; margin-bottom:1.5rem;">
            <strong>Ventana terapéutica:</strong> ${ventana.horasTexto} de evolución.<br>
            <span style="font-size:0.9rem; color:#CBD5E1;">${ventana.urgenciaMensaje}</span>
          </div>
        ` : ''}

        ${befastState.brazo === true ? `
          <div class="van-box">
            <h4 style="color:#93C5FD; font-size:1.1rem; margin-bottom:0.5rem;">🧠 Triaje de Oclusión de Gran Vaso (Escala VAN)</h4>
            <p style="font-size:0.85rem; color:#CBD5E1; margin-bottom:0.75rem;">
              Al haber debilidad en brazo, evalúa si hay signos corticales para traslado directo a hospital con sala de Trombectomía Mecánica:
            </p>
            <label style="display:block; margin-bottom:6px; cursor:pointer;">
              <input type="checkbox" ${vanState.vision ? 'checked' : ''} onchange="vanState.vision=this.checked; renderBefast();">
              <strong>V - Visión:</strong> Pérdida visual a un lado o visión doble.
            </label>
            <label style="display:block; margin-bottom:6px; cursor:pointer;">
              <input type="checkbox" ${vanState.afasia ? 'checked' : ''} onchange="vanState.afasia=this.checked; renderBefast();">
              <strong>A - Afasia:</strong> No entiende órdenes sencillas ("cierre los ojos") o habla incoherente.
            </label>
            <label style="display:block; margin-bottom:6px; cursor:pointer;">
              <input type="checkbox" ${vanState.negligencia ? 'checked' : ''} onchange="vanState.negligencia=this.checked; renderBefast();">
              <strong>N - Negligencia:</strong> Ignora estímulos en su lado izquierdo o mira fijamente hacia un lado.
            </label>

            ${vanRes.sospechaGranVaso ? `
              <div style="margin-top:10px; padding:10px; background:rgba(239,68,68,0.25); border-radius:8px; color:#FCA5A5; font-size:0.9rem; font-weight:700;">
                ⚠️ ALERTA VAN+: ${vanRes.recomendacionTransporte}
              </div>
            ` : ''}
          </div>
        ` : ''}
      `;
    }

    html += `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2 style="font-size:1.25rem;">Cuestionario BE-FAST (60 Segundos)</h2>
        <button onclick="resetBefast()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem;">🔄 Reiniciar</button>
      </div>

      <!-- B: Balance -->
      <div class="step-box">
        <div class="step-header">
          <span class="step-num">B</span>
          <span class="step-title">Balance / Equilibrio</span>
        </div>
        <p class="step-instructions">¿Ha perdido de repente el equilibrio, tiene dificultad para caminar o vértigo incoercible?</p>
        <div class="options-grid">
          <button class="btn-check ${befastState.equilibrio === false ? 'selected-normal' : ''}" onclick="setBefast('equilibrio', false)">
            <span>✅ Normal</span>
            <small style="font-weight:normal; font-size:0.8rem;">Camina con estabilidad</small>
          </button>
          <button class="btn-check ${befastState.equilibrio === true ? 'selected-danger' : ''}" onclick="setBefast('equilibrio', true)">
            <span>⚠️ Inestable</span>
            <small style="font-weight:normal; font-size:0.8rem;">Pérdida de equilibrio súbita</small>
          </button>
        </div>
      </div>

      <!-- E: Eyes -->
      <div class="step-box">
        <div class="step-header">
          <span class="step-num">E</span>
          <span class="step-title">Eyes / Ojos y Visión</span>
        </div>
        <p class="step-instructions">¿Ha perdido visión en un ojo repentinamente o ve doble (diplopía)?</p>
        <div class="options-grid">
          <button class="btn-check ${befastState.ojos === false ? 'selected-normal' : ''}" onclick="setBefast('ojos', false)">
            <span>✅ Normal</span>
            <small style="font-weight:normal; font-size:0.8rem;">Visión habitual</small>
          </button>
          <button class="btn-check ${befastState.ojos === true ? 'selected-danger' : ''}" onclick="setBefast('ojos', true)">
            <span>⚠️ Alterada</span>
            <small style="font-weight:normal; font-size:0.8rem;">Ceguera parcial o visión doble</small>
          </button>
        </div>
      </div>

      <!-- F: Face -->
      <div class="step-box">
        <div class="step-header">
          <span class="step-num">F</span>
          <span class="step-title">Face / Cara (Sonreír)</span>
        </div>
        <p class="step-instructions">Pídele que sonría o muestre los dientes. ¿Se le cae un lado de la boca?</p>
        <div class="options-grid">
          <button class="btn-check ${befastState.cara === false ? 'selected-normal' : ''}" onclick="setBefast('cara', false)">
            <span>✅ Normal</span>
            <small style="font-weight:normal; font-size:0.8rem;">Sonrisa simétrica</small>
          </button>
          <button class="btn-check ${befastState.cara === true ? 'selected-danger' : ''}" onclick="setBefast('cara', true)">
            <span>⚠️ Anormal</span>
            <small style="font-weight:normal; font-size:0.8rem;">Boca torcida o caída</small>
          </button>
        </div>
      </div>

      <!-- A: Arm -->
      <div class="step-box">
        <div class="step-header">
          <span class="step-num">A</span>
          <span class="step-title">Arm / Brazos (Fuerza)</span>
        </div>
        <p class="step-instructions">Pídele que levante ambos brazos hacia adelante durante 10 segundos con ojos cerrados.</p>
        <div class="options-grid">
          <button class="btn-check ${befastState.brazo === false ? 'selected-normal' : ''}" onclick="setBefast('brazo', false)">
            <span>✅ Normal</span>
            <small style="font-weight:normal; font-size:0.8rem;">Mantiene ambos brazos</small>
          </button>
          <button class="btn-check ${befastState.brazo === true ? 'selected-danger' : ''}" onclick="setBefast('brazo', true)">
            <span>⚠️ Anormal</span>
            <small style="font-weight:normal; font-size:0.8rem;">Un brazo cae o claudica</small>
          </button>
        </div>
      </div>

      <!-- S: Speech -->
      <div class="step-box">
        <div class="step-header">
          <span class="step-num">S</span>
          <span class="step-title">Speech / Habla y Comprensión</span>
        </div>
        <p class="step-instructions">Pídele repetir una frase simple: <em>«El cielo es azul en primavera»</em>.</p>
        <div class="options-grid">
          <button class="btn-check ${befastState.habla === false ? 'selected-normal' : ''}" onclick="setBefast('habla', false)">
            <span>✅ Normal</span>
            <small style="font-weight:normal; font-size:0.8rem;">Habla clara y comprende</small>
          </button>
          <button class="btn-check ${befastState.habla === true ? 'selected-danger' : ''}" onclick="setBefast('habla', true)">
            <span>⚠️ Anormal</span>
            <small style="font-weight:normal; font-size:0.8rem;">Arrastra palabras o confuso</small>
          </button>
        </div>
      </div>

      <!-- T: Time -->
      <div class="step-box">
        <div class="step-header">
          <span class="step-num">T</span>
          <span class="step-title">Time / Hora de Inicio</span>
        </div>
        <p class="step-instructions">¿A qué hora comenzaron los síntomas o cuándo se le vio bien por última vez?</p>
        <input type="time" id="inputHora" value="${befastState.hora}" onchange="befastState.hora=this.value; renderBefast();" 
               style="background:#0F172A; border:1px solid var(--border); color:white; padding:0.75rem 1rem; border-radius:10px; font-size:1.1rem; width:100%; max-width:240px;">
      </div>
    `;

    card.innerHTML = html;
  }

  function setBefast(key, val) {
    befastState[key] = val;
    renderBefast();
  }

  function resetBefast() {
    befastState = { equilibrio: null, ojos: null, cara: null, brazo: null, habla: null, hora: '' };
    vanState = { vision: false, afasia: false, negligencia: false };
    renderBefast();
  }

  function renderPulse() {
    var card = document.getElementById('contentCard');
    var res = IctusSOS.analizarRitmoPulso(pulseState.timestamps);

    var html = `
      <h2 style="font-size:1.35rem; margin-bottom:0.35rem;">Detector de Fibrilación Auricular (FA)</h2>
      <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:1.5rem;">
        La Fibrilación Auricular es la causa de 1 de cada 4 ictus. Cursa con ritmo cardíaco <strong>completamente irregular</strong>. 
        Pon tu dedo sobre tu pulso (cuello o muñeca) y pulsa el botón rojo en cada latido que sientas durante 15-20 segundos.
      </p>

      <button class="pulse-btn" onclick="registrarPulsacion()">
        <span>❤️ PULSO</span>
        <small style="font-size:0.75rem; font-weight:normal; margin-top:4px;">Toca con cada latido</small>
      </button>

      <div class="pulse-metric-box">
        <div class="metric-item">
          <div class="metric-value">${res.ok ? res.bpmEstimado : '--'}</div>
          <div class="metric-lbl">Frecuencia (lpm)</div>
        </div>
        <div class="metric-item">
          <div class="metric-value">${res.ok ? res.irregularidadPorcentaje + '%' : '--'}</div>
          <div class="metric-lbl">Irregularidad (CV)</div>
        </div>
        <div class="metric-item">
          <div class="metric-value">${pulseState.timestamps.length}</div>
          <div class="metric-lbl">Latidos contados</div>
        </div>
      </div>

      ${res.ok ? `
        <div style="margin-top:1.5rem; padding:1.25rem; border-radius:12px; background:${res.sospechaArritmia ? 'rgba(239, 68, 68, 0.2)' : 'rgba(16, 185, 129, 0.15)'}; border:1px solid ${res.sospechaArritmia ? 'var(--danger)' : 'var(--success)'};">
          <h4 style="font-size:1.1rem; color:${res.sospechaArritmia ? '#F87171' : '#6EE7B7'}; margin-bottom:0.35rem;">
            ${res.sospechaArritmia ? '⚠️ SOSPECHA DE ARRITMIA / FIBRILACIÓN' : '✅ RITMO REGULAR'}
          </h4>
          <p style="font-size:0.95rem; color:#CBD5E1;">${res.avisoClinico}</p>
        </div>
      ` : (pulseState.timestamps.length > 0 ? `
        <p style="text-align:center; color:var(--text-muted); margin-top:1rem; font-size:0.9rem;">
          Llevas ${pulseState.timestamps.length}/10 toques mínimos requeridos... Sigue pulsando rítmicamente.
        </p>
      ` : '')}

      <div style="text-align:center; margin-top:1.5rem;">
        <button onclick="pulseState.timestamps=[]; renderPulse();" style="background:#0F172A; border:1px solid var(--border); color:var(--text-muted); padding:0.5rem 1rem; border-radius:8px; cursor:pointer;">
          Reiniciar prueba de pulso
        </button>
      </div>
    `;

    card.innerHTML = html;
  }

  function registrarPulsacion() {
    pulseState.timestamps.push(Date.now());
    renderPulse();
  }

  function renderProtocol() {
    var card = document.getElementById('contentCard');
